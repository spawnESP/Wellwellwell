name: Build SpawnerESP Standalone

on:
  workflow_dispatch:
  push:
    paths:
      - 'SpawnerESP-Standalone-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract the standalone source (never select an older ZIP)
        run: |
          if [ ! -f "SpawnerESP-Standalone-source.zip" ]; then
            echo "ERROR: SpawnerESP-Standalone-source.zip is missing from the repository root."
            echo "Upload the new standalone ZIP with this exact filename."
            exit 1
          fi
          mkdir -p project
          unzip -q "SpawnerESP-Standalone-source.zip" -d project
          test -f project/build.gradle
          echo "Using source build file: $(realpath project/build.gradle)"
          grep -n 'fabric-api' project/build.gradle
          if grep -q 'modImplementation' project/build.gradle; then
            echo "ERROR: The selected source ZIP still contains modImplementation."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build mod
        working-directory: project
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpawnerESP-JAR
          path: project/build/libs/*.jar
          if-no-files-found: error
