
name: Build SpawnerESP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        id: project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No source ZIP found"
            exit 1
          fi
          mkdir extracted
          unzip "$ZIP_FILE" -d extracted
          BUILD_FILE=$(find extracted -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpawnerESP-JAR
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
